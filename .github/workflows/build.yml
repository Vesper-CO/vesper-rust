name: Build Vesper Rust client

# Takes Horizon's newest official nightly, renames the client to Vesper (rebrand.py), puts every native mod of Horizon's
# mod library into it that applies and compiles (vesper_native.py), builds it, and publishes a signed zip that Vesper
# downloads. Runs every Monday and on demand. A mod the library gained since last week is in the next build.
on:
  workflow_dispatch:
    inputs:
      native:
        description: Native mods to build in (all of the library, only those in native-mods.txt, or none)
        type: choice
        options: [all, listed, none]
        default: all
  schedule:
    - cron: '30 21 * * 1'

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/horizon-rust/horizon/releases/download/nightly
  VESPER_DISCORD_APP_ID: "1569533068992057504"

jobs:
  # On Linux: horizon-mixins and the registry's compile check (rsync, cargo check) run there. Produces the source to build.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries the game's check needs
        run: sudo apt-get update && sudo apt-get install -y rsync pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Download Horizon's nightly source and check its checksum
        run: |
          curl -fsSL -o horizon-source.tar.gz "$UPSTREAM/horizon-source.tar.gz"
          curl -fsSL -o UPSTREAM_SUMS "$UPSTREAM/SHA256SUMS"
          grep -E 'horizon-source\.tar\.gz$' UPSTREAM_SUMS | sha256sum -c -

      - name: Unpack and rebrand the source
        run: |
          mkdir src
          tar -xzf horizon-source.tar.gz -C src --strip-components=1
          cp assets/vesper.ico src/packaging/icons/horizon.ico
          cp assets/vesper-64.png src/crates/horizon-theme/icons/horizon-64.png
          python rebrand.py src
          tar -C src -czhf source-plain.tar.gz .

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            horizon-mods/native/target/compat/cargo

      - name: Native mods
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python vesper_native.py src src-native --mode "${{ inputs.native || 'all' }}"
          tar -C src-native -czf source-native.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            source-plain.tar.gz
            source-native.tar.gz
          if-no-files-found: error
          compression-level: 0

  build:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Download Horizon's nightly build and check its checksum
        shell: bash
        run: |
          curl -fsSL -o horizon-windows-x64.zip "$UPSTREAM/horizon-windows-x64.zip"
          curl -fsSL -o UPSTREAM_SUMS "$UPSTREAM/SHA256SUMS"
          grep -E 'horizon-windows-x64\.zip$' UPSTREAM_SUMS | sha256sum -c -

      - uses: actions/download-artifact@v4
        with:
          name: source

      - name: Unpack the source (with the native mods)
        shell: bash
        run: |
          mkdir src
          tar -xzf source-native.tar.gz -C src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      # If the mods build on Linux but not here, the week's build is still made, without them.
      - name: Build the client
        id: native
        continue-on-error: true
        shell: bash
        working-directory: src
        run: |
          features=""
          if grep -qE '^mods *=' crates/horizon-client/Cargo.toml; then features="--features horizon-client/mods"; fi
          cargo build --release --locked -p horizon-client --bin horizon-client $features

      - name: Build the client without the native mods
        if: steps.native.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Native mods NOT built::The native build failed on Windows, so this release has no native mods. See the Build the client step."
          printf '## Native mods were NOT built\n\nThe Windows build with native mods failed (see the "Build the client" step); this release is the plain client.\n' >> "$GITHUB_STEP_SUMMARY"
          rm -rf src && mkdir src
          tar -xzf source-plain.tar.gz -C src
          printf '{"mods":[],"discord":true,"mode":"none"}\n' > src/vesper-mods.json
          cd src
          cargo build --release --locked -p horizon-client --bin horizon-client

      - name: Package
        shell: bash
        run: |
          7z x -opkg horizon-windows-x64.zip > /dev/null
          dir=$(ls pkg | head -1)
          cp src/target/release/horizon-client.exe "pkg/$dir/vesper-client.exe"
          rm -f "pkg/$dir/horizon-client.exe"
          cp src/vesper-mods.json "pkg/$dir/vesper-mods.json"
          cp LICENSE-HORIZON NOTICE.md "pkg/$dir/"
          mkdir -p out
          # Published beside the zip (and covered by the signed SHA256SUMS) so the launcher can list a build's mods
          # without downloading it.
          cp src/vesper-mods.json out/vesper-mods.json
          (cd pkg && 7z a -tzip ../out/vesper-rust-windows-x64.zip "$dir" > /dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: vesper-rust
          path: |
            out/vesper-rust-windows-x64.zip
            out/vesper-mods.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vesper-rust

      - name: Checksums and signature
        env:
          RUST_SIGNING_KEY: ${{ secrets.RUST_SIGNING_KEY }}
        run: |
          sha256sum vesper-rust-windows-x64.zip vesper-mods.json > SHA256SUMS
          printf 'vesper rust release\n' > msg.bin
          cat SHA256SUMS >> msg.bin
          printf '%s\n' "$RUST_SIGNING_KEY" > key.pem
          openssl pkeyutl -sign -rawin -inkey key.pem -in msg.bin -out sig.bin
          base64 -w0 sig.bin > SHA256SUMS.sig
          rm -f key.pem sig.bin msg.bin

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "rust-$(date -u +%Y%m%d)-${{ github.run_number }}" \
            vesper-rust-windows-x64.zip vesper-mods.json SHA256SUMS SHA256SUMS.sig \
            --repo "${{ github.repository }}" \
            --title "Vesper Rust client $(date -u +%Y-%m-%d)" \
            --notes "Built from Horizon's nightly of the same day, with every native mod of Horizon's library that builds. Vesper downloads this automatically."
